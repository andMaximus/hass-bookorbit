# ==============================================================================
# The Home Assistant Ingress panel.
#
# This server exists only for Ingress. The mapped port goes straight to Fastify
# with upstream's own untouched client, so nothing here is in the path of a Kobo,
# a KOReader plugin, an OPDS client or a reverse proxy.
#
# The Supervisor strips the /api/hassio_ingress/<token>/ prefix before proxying
# and passes it in X-Ingress-Path. The client is built with a relative base and
# reads that prefix from the <base href> injected below, so it never needs to know
# the token at build time.
# ==============================================================================

worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;
daemon off;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Book uploads and downloads go through here in the panel, so no body cap and
    # no buffering of large responses to disk before the browser sees them.
    client_max_body_size 0;
    proxy_max_temp_file_size 0;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8099 default_server;

        # The API, the Kobo/KOReader/OPDS routes and everything else Fastify owns.
        location /api/ {
            proxy_pass http://127.0.0.1:3000;
        }

        # socket.io needs the upgrade dance; the client asks for <prefix>/socket.io,
        # which reaches us here with the prefix already stripped.
        location /socket.io/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }

        # The patched client, served from its own root so upstream's build is
        # untouched. sub_filter runs on the HTML only, which is all that needs it:
        # every asset reference in it is already relative.
        location / {
            root /app/public-ingress;
            try_files $uri $uri/ /index.html;

            sub_filter '<head>' '<head><base href="$http_x_ingress_path/">';
            sub_filter_once on;
            sub_filter_types text/html;

            # Ingress sessions are short-lived and the token changes, so caching the
            # HTML would hand a stale prefix to the next session.
            add_header Cache-Control "no-store" always;
        }
    }
}
